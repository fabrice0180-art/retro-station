name: Fabriquer les installateurs

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["README.md", "LISEZ-MOI.txt"]

permissions:
  contents: write

env:
  RS_VERSION: "1.2.0"

jobs:
  windows:
    name: Windows (setup.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: pip install -r requirements.txt pyinstaller
      - name: Application autonome
        run: pyinstaller --noconfirm --windowed --name RetroStation --icon assets/icon.ico --add-data "assets;assets" RetroStation.pyw
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Installateur
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          & $iscc.FullName packaging\windows\RetroStation.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: installers/*.exe

  mac:
    name: Mac universel Intel + puce M (DMG)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Python universel (python.org)
        run: |
          curl -fsSL -o py.pkg https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg py.pkg -target /
          /Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12 -m venv venv
      - name: Dépendances
        run: venv/bin/python -m pip install -r requirements.txt pyinstaller delocate
      - name: Pillow universel (fusion Intel + puce M)
        run: |
          mkdir -p wh fused
          venv/bin/python -m pip download pillow --only-binary=:all: --python-version 3.12 --platform macosx_11_0_arm64 -d wh/arm
          venv/bin/python -m pip download pillow --only-binary=:all: --python-version 3.12 --platform macosx_11_0_x86_64 -d wh/x86
          venv/bin/delocate-merge wh/arm/*.whl wh/x86/*.whl -w fused
          venv/bin/python -m pip install --force-reinstall --no-deps fused/*.whl
      - name: Application + DMG
        run: bash packaging/mac/build_dmg.sh venv/bin/python
      - name: Vérification des deux architectures
        run: lipo -archs "dist/Retro Station.app/Contents/MacOS/Retro Station"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: installers/*.dmg

  release:
    name: Publication
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-{1}', env.RS_VERSION, github.run_number) }}
          name: Rétro Station ${{ env.RS_VERSION }} (fabrication ${{ github.run_number }})
          body: |
            Rétro Station — par Fabrice M.

            • Windows : RetroStation-Setup-…-Windows.exe
            • Mac (tous les Mac, Intel et puce M) : RetroStation-…-Mac-Universel.dmg
          files: out/*
